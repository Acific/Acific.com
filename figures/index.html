<body>
  <div class="wall">
    <article class="card" style="--band: #e0c24f">
      <header class="card-head">
        <a class="mark" href="/" aria-label="Acific home"><span class="alpha" aria-hidden="true">α</span></a>
        <p class="meta">Figures<br>Nine studies</p>
      </header>

      <h1 class="title reveal">Figures</h1>
      <p class="by reveal">Small experiments in motion</p>
      <p class="hint reveal">Every figure is live. Move across them.</p>
      <section class="tickets" aria-label="Figures">
        <figure class="ticket reveal" style="--band: #b07a78">
          <span class="ticket-mark"><span class="alpha" aria-hidden="true">α</span></span>
          <svg data-figure="orbit" role="img" aria-label="Orbit figure"></svg>
          <figcaption><span class="ticket-name">Orbit</span><span class="ticket-sub">Figure 01</span><span class="ticket-note">A body and its satellite inside a ring. It turns to face you; click to fling.</span></figcaption>
        </figure>
        <figure class="ticket reveal" style="--band: #e0c24f">
          <span class="ticket-mark"><span class="alpha" aria-hidden="true">α</span></span>
          <svg data-figure="matrix" role="img" aria-label="Matrix figure"></svg>
          <figcaption><span class="ticket-name">Matrix</span><span class="ticket-sub">Figure 02</span><span class="ticket-note">A dot grid that spells the lab's name. Your pointer draws on it.</span></figcaption>
        </figure>
        <figure class="ticket reveal" style="--band: #84a9bc">
          <span class="ticket-mark"><span class="alpha" aria-hidden="true">α</span></span>
          <svg data-figure="weave" role="img" aria-label="Weave figure"></svg>
          <figcaption><span class="ticket-name">Weave</span><span class="ticket-sub">Figure 03</span><span class="ticket-note">Fifteen circles and their diagonals, leaning toward the pointer.</span></figcaption>
        </figure>
        <figure class="ticket reveal" style="--band: #a89383">
          <span class="ticket-mark"><span class="alpha" aria-hidden="true">α</span></span>
          <svg data-figure="lift" role="img" aria-label="Lift figure"></svg>
          <figcaption><span class="ticket-name">Lift</span><span class="ticket-sub">Figure 04</span><span class="ticket-note">Five dots in a row. The nearest one rises.</span></figcaption>
        </figure>
        <figure class="ticket reveal" style="--band: #c4704f">
          <span class="ticket-mark"><span class="alpha" aria-hidden="true">α</span></span>
          <svg data-figure="funnel" role="img" aria-label="Funnel figure"></svg>
          <figcaption><span class="ticket-name">Funnel</span><span class="ticket-sub">Figure 05</span><span class="ticket-note">Nested ellipses converging on a point that follows you.</span></figcaption>
        </figure>
        <figure class="ticket reveal" style="--band: #a8a548">
          <span class="ticket-mark"><span class="alpha" aria-hidden="true">α</span></span>
          <svg data-figure="bars" role="img" aria-label="Bars figure"></svg>
          <figcaption><span class="ticket-name">Bars</span><span class="ticket-sub">Figure 06</span><span class="ticket-note">Lines and blocks. The blocks sink where you pass.</span></figcaption>
        </figure>
        <figure class="ticket reveal" style="--band: #7d8fb3">
          <span class="ticket-mark"><span class="alpha" aria-hidden="true">α</span></span>
          <svg data-figure="network" role="img" aria-label="Network figure"></svg>
          <figcaption><span class="ticket-name">Network</span><span class="ticket-sub">Figure 07</span><span class="ticket-note">Nodes on threads around a core.</span></figcaption>
        </figure>
        <figure class="ticket reveal" style="--band: #6f9a8d">
          <span class="ticket-mark"><span class="alpha" aria-hidden="true">α</span></span>
          <svg data-figure="grid" role="img" aria-label="Stations figure"></svg>
          <figcaption><span class="ticket-name">Stations</span><span class="ticket-sub">Figure 08</span><span class="ticket-note">A body travelling between four stations.</span></figcaption>
        </figure>
        <figure class="ticket reveal" style="--band: #1f1f1f">
          <span class="ticket-mark"><span class="alpha" aria-hidden="true">α</span></span>
          <svg data-figure="pair" role="img" aria-label="Pair figure"></svg>
          <figcaption><span class="ticket-name">Pair</span><span class="ticket-sub">Figure 09</span><span class="ticket-note">Two bodies in a slow dance.</span></figcaption>
        </figure>
      </section>
